authors:
   Pan American Health Organization:
     html: "<img src='https://github.com/IM-Data-PAHO/pahoabc/blob/main/man/figures/pahobrand-blue-stacked-2024-en.png?raw=true' height='100' alt='PAHO'/>"
     href: "https://www.paho.org/en"

reference:
  - title: Date Consistency Comparison
    desc: Functions for identifying and visualizing date inconsistencies in the EIR.
    contents:
      - dcc_rate
      - dcc_barplot
      - dcc_inconsistent
      - dcc_inconsistent_plot

  - title: Eligibility Consistency Comparison
    desc: Functions for identifying and visualizing eligibility inconsistencies (age at vaccination vs. scheduled age window) in the EIR.
    contents:
      - ecc_rate
      - ecc_barplot
      - ecc_inconsistent
      - ecc_inconsistent_plot

  - title: Nominal Dropout Rate
    desc: Functions for calculating and visualizing nominal dropout rate.
    contents:
      - nod_dropout
      - nod_barplot

  - title: Residence vs. Ocurrence Analyses
    desc: Functions for calculating and visualizing coverage and dose distribution by place of residence or vaccination.
    contents:
      - roc_coverage
      - roc_barplot
      - roc_distribution
      - roc_heatmap
      - roc_coverage_by
      - bc_coverage
      - bc_barplot

  - title: Complete Schedule Coverage
    desc: Functions for calculating and visualizing complete schedule coverage.
    contents:
      - cs_coverage
      - cs_barplot
      - cs_upsetplot

  - title: Birth Cohort Coverage
    desc: Functions for calculating and visualizing birth cohort coverage.
    contents:
      - bc_coverage
      - bc_barplot

  - title: Example Data
    desc: Example data frames to understand how the package works and what it expects.
    contents:
      - pahoabc.EIR
      - pahoabc.pop.ADM0
      - pahoabc.pop.ADM1
      - pahoabc.pop.ADM2
      - pahoabc.schedule
