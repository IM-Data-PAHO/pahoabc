        href: articles/en/nominal_dropout_en.html
      - text: Residence vs. Occurrence Analyses
        href: articles/en/residence_occurrence_en.html
      - text: Complete Schedule Coverage
        href: articles/en/complete_schedule_en.html
      - text: Birth Cohort Coverage
        href: articles/en/birth_cohort_coverage_en.html
      - text: Date Consistency Comparison
        href: articles/en/date_consistency_comparison_en.html
      - text: Eligibility Consistency Comparison
        href: articles/en/eligibility_consistency_comparison_en.html
      - text: -------
